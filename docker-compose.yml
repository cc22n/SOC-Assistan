# Rotación de logs del driver json-file: sin esto crecen sin límite en
# /var/lib/docker/containers/ hasta llenar el disco del VPS (ENOSPC).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  # ===========================================
  # SOC Agent - Flask App
  # ===========================================
  app:
    build: .
    # Misma imagen para `app` y `feeds`: una sola construcción.
    image: soc-agent:latest
    container_name: soc-agent
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:5000:5000"
    # .env.docker: copia .env.example y define al menos SECRET_KEY (>=32 chars)
    # y las API keys que tengas. Las variables de abajo tienen prioridad sobre
    # el env_file, así que DATABASE_URL/REDIS_URL siempre apuntan a los servicios.
    env_file:
      - path: .env.docker
        required: false
    # En produccion, sobreescribe POSTGRES_PASSWORD via .env.docker o una
    # variable de entorno del host — no dejes el default de desarrollo.
    environment:
      - DATABASE_URL=postgresql://soc_admin:${POSTGRES_PASSWORD:-soc_secure_password}@db:5432/soc_agent
      - REDIS_URL=redis://redis:6379/0
      - FLASK_ENV=production
      # Hosts aceptados en la cabecera Host (separados por coma; ".dominio.com" incluye subdominios).
      # Detrás de un proxy con dominio propio, defínelo en .env.docker o en el entorno del host.
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-127.0.0.1,localhost}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_logs:/app/logs
    networks:
      - soc-network

  # ===========================================
  # Feeds proactivos (WP6): CVEs nuevos de CISA KEV y NVD, casados con el stack declarado.
  # Proceso APARTE de la app a propósito: dentro de Gunicorn (3 workers) un planificador se ejecutaría 3 veces.
  # Cada pocos minutos ejecuta las fuentes vencidas (lo vencido sale de la tabla feed_runs: sobrevive a reinicios).
  # Espera a que `app` esté sana porque es ella quien aplica las migraciones (docker/init_db.py).
  # ===========================================
  feeds:
    image: soc-agent:latest
    restart: unless-stopped
    logging: *default-logging
    command: ["flask", "feeds", "daemon"]
    env_file:
      - path: .env.docker
        required: false
    environment:
      - DATABASE_URL=postgresql://soc_admin:${POSTGRES_PASSWORD:-soc_secure_password}@db:5432/soc_agent
      - REDIS_URL=redis://redis:6379/0
      - FLASK_ENV=production
      - FLASK_APP=wsgi.py
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      disable: true            # la imagen trae un HEALTHCHECK HTTP que aquí no aplica (no sirve HTTP)
    networks:
      - soc-network

  # ===========================================
  # PostgreSQL
  # ===========================================
  db:
    image: postgres:16-alpine
    container_name: soc-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: soc_agent
      POSTGRES_USER: soc_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soc_secure_password}
    # Publicar solo para debug local (psql desde el host). En produccion, no exponer.
    # ports:
    #   - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soc_admin -d soc_agent"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - soc-network

  # ===========================================
  # Redis (health check / cache opcional)
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: soc-redis
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - soc-network

volumes:
  postgres_data:
  redis_data:
  app_logs:

networks:
  soc-network:
    driver: bridge
