{% extends 'base.html' %}
{% block title %}403 - Acceso Restringido | SOC Agent{% endblock %}
{% block content %}
<div class="min-h-[60vh] flex items-center justify-center">
    <div class="max-w-md w-full text-center p-8 bg-white rounded-xl shadow-lg border border-gray-100">
        <div class="w-16 h-16 mx-auto mb-4 bg-red-100 text-red-600 rounded-full flex items-center justify-center text-2xl font-bold">
            <i class="fas fa-lock"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-800 mb-2">403 - Acceso Restringido</h1>
        <p class="text-gray-600 mb-6">{{ message or 'No posees los privilegios de rol suficientes para acceder a este recurso.' }}</p>
        <a href="{{ url_for('main.dashboard') if current_user.is_authenticated else url_for('main.index') }}" class="inline-flex items-center px-4 py-2 bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700 transition">
            <i class="fas fa-arrow-left mr-2"></i> Regresar a zona segura
        </a>
    </div>
</div>
{% endblock %}
