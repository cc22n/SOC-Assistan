{% extends 'base.html' %}
{% block title %}404 - Página no encontrada | SOC Agent{% endblock %}
{% block content %}
<div class="min-h-[60vh] flex items-center justify-center">
    <div class="max-w-md w-full text-center p-8 bg-white rounded-xl shadow-lg border border-gray-100">
        <div class="w-16 h-16 mx-auto mb-4 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center text-2xl font-bold">
            <i class="fas fa-search"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-800 mb-2">404 - Recurso no encontrado</h1>
        <p class="text-gray-600 mb-6">La ruta o elemento solicitado no existe en el sistema o fue removido.</p>
        <a href="{{ url_for('main.index') }}" class="inline-flex items-center px-4 py-2 bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700 transition">
            <i class="fas fa-home mr-2"></i> Volver al inicio
        </a>
    </div>
</div>
{% endblock %}
